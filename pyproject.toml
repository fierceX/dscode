[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mink-agent"
version = "0.1.15"
description = "Python SDK for mink — sandboxed AI coding agent"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "fiercex" }]
keywords = ["ai", "coding-agent", "sandbox", "deepseek"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/fierceX/mink"
Source = "https://github.com/fierceX/mink"

[tool.setuptools.packages.find]
include = ["mink_agent", "mink_agent.*"]

[tool.setuptools.package-data]
"mink_agent" = ["_binary/*"]
