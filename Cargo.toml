[package]
name = "mink-agent"
version = "0.1.7"
edition = "2024"
description = "A lightweight AI coding agent with signal-driven belief system"
license = "MIT"
repository = "https://github.com/fierceX/mink"
homepage = "https://github.com/fierceX/mink"
readme = "README.md"
keywords = ["ai", "coding-agent", "deepseek", "terminal", "agent"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "mink"
path = "src/lib.rs"

[[bin]]
name = "mink"
path = "src/main.rs"

[[bin]]
name = "mink-core"
path = "src/bin/mink-core.rs"
required-features = ["sdk"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
once_cell = "1"
regex = "1"
ignore = "0.4"
globset = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
rustyline = { version = "14", optional = true }
crossterm = { version = "0.29", optional = true }
time = { version = "0.3.47", features = ["formatting", "macros"] }
toml = "0.8"
tokio = { version = "1", features = ["full"] }
ratatui = { version = "0.30", optional = true }
unicode-width = "0.2"
wasmtime = { version = "28", features = ["async"], optional = true }
wasmtime-wasi = { version = "28", optional = true }

[features]
default = ["python-sandbox", "repl", "tui"]
python-sandbox = ["dep:wasmtime", "dep:wasmtime-wasi"]
repl = ["dep:rustyline"]
tui = ["dep:crossterm", "dep:ratatui"]
sdk = []
slow-tests = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
