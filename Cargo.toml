[workspace]
members = [
    "crates/mink-core",
    "crates/mink-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.13"
edition = "2024"
license = "MIT"
repository = "https://github.com/fierceX/mink"
homepage = "https://github.com/fierceX/mink"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
once_cell = "1"
regex = "1"
ignore = "0.4"
globset = "0.4"
grep-printer = "0.3"
grep-regex = "0.1"
grep-searcher = "0.1"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "socks", "stream", "query", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
similar = "3"
rustyline = "18"
crossterm = "0.29"
time = { version = "0.3.52", features = ["formatting", "macros"] }
toml = "1.1"
tokio = { version = "1", features = ["full"] }
ratatui = "0.30"
unicode-width = "0.2"
wasmtime = { version = "46", features = ["async"] }
wasmtime-wasi = "46"
axum = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
