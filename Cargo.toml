[workspace]
members = [
    "crates/mink-core",
    "crates/mink-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.8"
edition = "2024"
license = "MIT"
repository = "https://github.com/fierceX/mink"
homepage = "https://github.com/fierceX/mink"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
once_cell = "1"
regex = "1"
ignore = "0.4"
globset = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
rustyline = "14"
crossterm = "0.29"
time = { version = "0.3.47", features = ["formatting", "macros"] }
toml = "0.8"
tokio = { version = "1", features = ["full"] }
ratatui = "0.30"
unicode-width = "0.2"
wasmtime = { version = "28", features = ["async"] }
wasmtime-wasi = "28"
axum = "0.7"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
