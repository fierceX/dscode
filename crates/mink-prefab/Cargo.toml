[package]
name = "mink-prefab"
version.workspace = true
edition.workspace = true
description = "Prefab Anchored Standard session seeder for mink"
license.workspace = true

[dependencies]
anyhow.workspace = true
mink-core = { version = "0.6.0", path = "../mink-core", default-features = false, features = ["runtime"], optional = true }
serde = { workspace = true }
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
time.workspace = true

[features]
# Optional runtime integration: depends on `mink-core` and provides the
# `PrefixSource` / `PostInitHook` adapters in `adapter.rs`. The standalone
# seeder core (seed/template) stays usable without this feature.
mink-integration = ["dep:mink-core", "dep:sha2"]

[dev-dependencies]
async-trait.workspace = true
futures.workspace = true
tokio.workspace = true
