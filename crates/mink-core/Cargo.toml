[package]
name = "mink-core"
version.workspace = true
edition.workspace = true
description = "Embeddable Rust runtime for the mink AI coding agent"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["ai", "coding-agent", "deepseek", "terminal", "agent"]
categories = ["development-tools"]
include = [
    "/Cargo.toml",
    "/build.rs",
    "/README.md",
    "/LICENSE*",
    "/src/**",
    "/skills/**",
    "/examples/**",
]

[lib]
name = "mink"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
futures.workspace = true
once_cell.workspace = true
regex.workspace = true
ignore.workspace = true
globset.workspace = true
libc.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
time.workspace = true
toml.workspace = true
tokio.workspace = true
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
axum = { workspace = true, optional = true }

[dev-dependencies]
redb = "3"

[[example]]
name = "web_api"
required-features = ["web-api"]

[features]
default = ["runtime"]
runtime = []
python-sandbox = ["dep:wasmtime", "dep:wasmtime-wasi"]
web-api = ["runtime", "dep:axum"]
slow-tests = []
