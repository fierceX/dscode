[package]
name = "mink-cli"
version.workspace = true
edition.workspace = true
description = "CLI binaries for the mink AI coding agent"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "mink"
path = "src/main.rs"

[[bin]]
name = "mink-core"
path = "src/bin/mink-core.rs"
required-features = ["sdk-bin"]

[dependencies]
anyhow.workspace = true
crossterm = { workspace = true, optional = true }
ignore = { workspace = true, optional = true }
mink = { package = "mink-core", path = "../mink-core", default-features = false }
mink-router = { path = "../mink-router", optional = true }
ratatui = { workspace = true, optional = true }
rustyline = { workspace = true, optional = true }
serde_json.workspace = true
serde.workspace = true
time.workspace = true
tokio.workspace = true
toml.workspace = true
unicode-width.workspace = true

[features]
default = ["full-cli"]
runtime = ["mink/runtime"]
cli = ["runtime", "repl"]
repl = ["runtime", "dep:rustyline"]
tui = ["runtime", "dep:crossterm", "dep:ignore", "dep:ratatui"]
prefab = ["mink/prefab"]
router = ["dep:mink-router", "prefab"]
python-sandbox = ["mink/python-sandbox"]
full-cli = ["cli", "tui", "python-sandbox", "prefab", "router"]
sdk-bin = ["runtime"]
sdk = ["sdk-bin"]
slow-tests = ["mink/slow-tests"]
