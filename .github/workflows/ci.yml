name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Test (fast, runs first) ────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: make check
      - run: cargo test

  # ── Build multi-arch binaries ──────────────────────────────────
  binaries:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: linux-amd64
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            suffix: linux-amd64-musl
          - runner: macos-14
            target: aarch64-apple-darwin
            suffix: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build mink binary
        run: |
          mkdir -p dist
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          fi
          cargo build --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/mink dist/mink-${{ matrix.suffix }}

      - uses: actions/upload-artifact@v4
        with:
          name: mink-${{ matrix.suffix }}
          path: dist/mink-${{ matrix.suffix }}

  # ── Build platform wheels ──────────────────────────────────────
  wheels:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-latest
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
          - os: linux
            arch: x86_64-musl
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip setuptools wheel build

      - name: Build Rust binary (release)
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
            cargo build --release --target ${{ matrix.target }}
            mkdir -p target/release
            cp target/${{ matrix.target }}/release/mink target/release/mink
          else
            cargo build --release
          fi
        env:
          CARGO_TERM_COLOR: always

      - name: Build platform-specific wheel
        run: python scripts/build_wheel.py
        env:
          MINK_SDK_SKIP_BUILD: "1"
          PLATFORM_TAG: ${{ matrix.target == 'x86_64-unknown-linux-musl' && 'musllinux_1_2_x86_64' || '' }}

      - name: Verify wheel contains binary
        run: |
          import zipfile
          from pathlib import Path
          whl = list(Path('dist').glob('*.whl'))[0]
          with zipfile.ZipFile(whl) as z:
              names = z.namelist()
              print('\n'.join(names))
              assert any('_binary/mink' in n for n in names), 'missing binary'
        shell: python

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  # ── Publish (on v* tag only) ───────────────────────────────────
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, wheels]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # PyPI Trusted Publishing
      contents: write   # GitHub Release
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --registry crates-io || echo "crate already published, skipping"

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mink-*
          path: dist/bin
          merge-multiple: true

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/wheels
          merge-multiple: true

      - name: Show all artifacts
        run: ls -lh dist/bin/ dist/wheels/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bin/mink-*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/wheels
          skip-existing: true
