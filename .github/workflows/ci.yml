name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Test (fast, runs first) ────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: make check
      - run: cargo test

  # ── Build multi-arch binaries ──────────────────────────────────
  binaries:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-amd64
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64
          - runner: macos-14
            target: aarch64-apple-darwin
            suffix: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker (linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          which aarch64-linux-gnu-gcc || echo "linker installed"

      - name: Build mink binary
        run: |
          mkdir -p dist
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/mink dist/mink-${{ matrix.suffix }}

      - uses: actions/upload-artifact@v4
        with:
          name: mink-${{ matrix.suffix }}
          path: dist/mink-${{ matrix.suffix }}

  # ── Build platform wheels ──────────────────────────────────────
  wheels:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-latest
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
          - os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'aarch64' && 'aarch64-unknown-linux-gnu' || '' }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip setuptools wheel build

      - name: Build Rust binary (release)
        run: cargo build --release
        env:
          CARGO_TERM_COLOR: always

      - name: Build platform-specific wheel
        run: python scripts/build_wheel.py
        env:
          MINK_SDK_SKIP_BUILD: "1"

      - name: Verify wheel contains binary
        run: |
          import zipfile
          from pathlib import Path
          whl = list(Path('dist').glob('*.whl'))[0]
          with zipfile.ZipFile(whl) as z:
              names = z.namelist()
              print('\n'.join(names))
              assert any('_binary/mink' in n for n in names), 'missing binary'
        shell: python

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  # ── Publish (on v* tag only) ───────────────────────────────────
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, wheels]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # PyPI Trusted Publishing
      contents: write   # GitHub Release
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --registry crates-io

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mink-*
          path: dist
          merge-multiple: true

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Show all artifacts
        run: ls -lh dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mink-*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
