name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Test (fast, runs first) ────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: make check
      - run: make feature-matrix
      - run: cargo test

  # ── Static docs / homepage validation ──────────────────────────
  pages-check:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare published docs files
        run: cp CHANGELOG.md docs/CHANGELOG.md

      - name: Validate homepage assets
        run: |
          test -f docs/.nojekyll
          test -f docs/index.html
          test -f docs/assets/hero-replay.json
          test -f docs/USAGE.md
          test -f docs/EMBEDDING.md
          test -f docs/PROTOCOL.md
          test -f docs/tools.md
          test -f docs/ARCHITECTURE.md
          test -f docs/DESIGN.md
          test -f docs/CHANGELOG.md
          test -f docs/设计哲学-信号系统.md
          test -f docs/设计哲学-工具能力与提示词解耦.md
          test -f docs/server.md

      - name: Validate hero replay JSON
        run: python3 -m json.tool docs/assets/hero-replay.json > /dev/null

      - name: Check homepage doc references
        run: |
          # 侧栏引用的每篇文档都必须存在（含 CI 生成的 CHANGELOG.md）
          for f in USAGE.md EMBEDDING.md PROTOCOL.md tools.md ARCHITECTURE.md DESIGN.md \
                   CHANGELOG.md server.md 设计哲学-信号系统.md 设计哲学-工具能力与提示词解耦.md; do
            grep -q "loadDoc('$f')" docs/index.html || { echo "missing sidebar ref: $f"; exit 1; }
            test -f "docs/$f" || { echo "missing doc file: docs/$f"; exit 1; }
          done
          grep -q "fetch(path)" docs/index.html
          grep -q 'fetch("assets/hero-replay.json")' docs/index.html

  # ── Build multi-arch binaries ──────────────────────────────────
  binaries:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: linux-amd64
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            suffix: linux-amd64-musl
          - runner: macos-14
            target: aarch64-apple-darwin
            suffix: darwin-arm64
          - runner: ubuntu-latest
            target: x86_64-unknown-freebsd
            suffix: freebsd-amd64
            freebsd: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # ── FreeBSD build (via VM) ──
      - name: Build on FreeBSD VM
        if: matrix.freebsd
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          usesh: true
          mem: 4096
          prepare: |
            pkg install -y rust llvm node npm
          run: |
            cd crates/mink-server/web && npm ci && cd ../..
            cargo build --release -p mink-server
            cargo build --release
            mkdir -p dist
            cp target/release/mink dist/mink-freebsd-amd64
            cp target/release/mink-server dist/mink-server-freebsd-amd64
            test -s dist/mink-server-freebsd-amd64

      # ── Linux / macOS build ──
      - uses: dtolnay/rust-toolchain@stable
        if: '!matrix.freebsd'
        with:
          targets: ${{ matrix.target }}

      - name: Install Python (for zigbuild)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cargo-zigbuild
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: pip install -q cargo-zigbuild

      - name: Install web deps (embedded frontend)
        if: '!matrix.freebsd'
        run: npm ci --prefix crates/mink-server/web

      - name: Build mink + mink-server binaries
        if: '!matrix.freebsd'
        run: |
          mkdir -p dist
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            cargo zigbuild --release --target x86_64-unknown-linux-musl
            cargo zigbuild -p mink-server --release --target x86_64-unknown-linux-musl
          else
            cargo build --release --target ${{ matrix.target }}
            cargo build -p mink-server --release --target ${{ matrix.target }}
          fi
          cp target/${{ matrix.target }}/release/mink dist/mink-${{ matrix.suffix }}
          cp target/${{ matrix.target }}/release/mink-server dist/mink-server-${{ matrix.suffix }}
          # 内嵌前端校验：server 二进制大小应显著大于纯 Rust 骨架（> 1MB 视为含 dist）
          test "$(stat -c%s dist/mink-server-${{ matrix.suffix }} 2>/dev/null || stat -f%z dist/mink-server-${{ matrix.suffix }})" -gt 1000000

      - uses: actions/upload-artifact@v4
        with:
          name: mink-${{ matrix.suffix }}
          path: |
            dist/mink-${{ matrix.suffix }}
            dist/mink-server-${{ matrix.suffix }}

  # ── Build platform wheels ──────────────────────────────────────
  wheels:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-latest
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
          - os: linux
            arch: x86_64-musl
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cargo-zigbuild
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: pip install -q cargo-zigbuild

      - name: Install build dependencies
        run: python -m pip install --upgrade pip setuptools wheel build

      - name: Build Rust binary (release)
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            cargo zigbuild -p mink-cli --release --target x86_64-unknown-linux-musl --no-default-features --features sdk-bin --bin mink-core
            mkdir -p target/release
            cp target/${{ matrix.target }}/release/mink-core target/release/mink-core
          else
            cargo build -p mink-cli --release --no-default-features --features sdk-bin --bin mink-core
          fi
        env:
          CARGO_TERM_COLOR: always

      - name: Build platform-specific wheel
        run: python scripts/build_wheel.py
        env:
          MINK_SDK_SKIP_BUILD: "1"
          GLIBC_VERSION: ${{ matrix.target == 'x86_64-unknown-linux-musl' && '' || '2_35' }}
          PLATFORM_TAG: ${{ matrix.target == 'x86_64-unknown-linux-musl' && 'musllinux_1_2_x86_64' || '' }}

      - name: Verify wheel contains binary
        run: |
          import zipfile
          from pathlib import Path
          whl = list(Path('dist').glob('*.whl'))[0]
          with zipfile.ZipFile(whl) as z:
              names = z.namelist()
              print('\n'.join(names))
              assert any('_binary/mink-core' in n for n in names), 'missing binary'
        shell: python

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  # ── Publish (on v* tag only) ───────────────────────────────────
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, wheels]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # PyPI Trusted Publishing
      contents: write   # GitHub Release
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo package -p mink-core --list
          cargo package -p mink-core --registry crates-io
          cargo publish -p mink-core --registry crates-io || echo "crate already published, skipping"

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mink-*
          path: dist/bin
          merge-multiple: true

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/wheels
          merge-multiple: true

      - name: Show all artifacts
        run: ls -lh dist/bin/ dist/wheels/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bin/mink-*
            dist/bin/mink-server-*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/wheels
          skip-existing: true

  # ── GitHub Pages (docs/ as site root) ──────────────────────────
  pages:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.repository == 'fierceX/mink'
    needs: [test, pages-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare published docs files
        run: |
          cp CHANGELOG.md docs/CHANGELOG.md
          # 内部文档不上传到站点（避免公开维护建议与技术笔记）
          rm -f docs/TUI_OPTIMIZATION_ROADMAP.md docs/VFS_FORMATTER_RG_STYLE_GAP.md

      - name: Upload docs site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
