name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Test (fast, runs first) ────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: make check
      - run: cargo test

  # ── Build multi-arch binaries ──────────────────────────────────
  binaries:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: linux-amd64
          - runner: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            suffix: linux-amd64-musl
          - runner: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            suffix: linux-arm64-musl
          - runner: macos-14
            target: aarch64-apple-darwin
            suffix: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker (linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          which aarch64-linux-gnu-gcc || echo "linker installed"

      - name: Install musl tools (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install musl cross toolchain (linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          curl -sL https://musl.cc/aarch64-linux-musl-cross.tgz -o /tmp/musl-cross.tgz
          sudo tar xzf /tmp/musl-cross.tgz -C /opt
          echo "/opt/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH

      - name: Build mink binary
        run: |
          mkdir -p dist
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          fi
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-musl-gcc
          fi
          cargo build --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/mink dist/mink-${{ matrix.suffix }}

      - uses: actions/upload-artifact@v4
        with:
          name: mink-${{ matrix.suffix }}
          path: dist/mink-${{ matrix.suffix }}

  # ── Build manylinux_2_28 compatible binaries & wheels ──────────
  manylinux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: quay.io/pypa/manylinux_2_28_x86_64
            arch: amd64
    steps:
      - uses: actions/checkout@v4

      - name: Build in manylinux_2_28 container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ matrix.image }} \
            bash -c "
              set -euo pipefail

              # Install Rust
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y -q --default-toolchain stable
              source \$HOME/.cargo/env

              # Build Rust binary
              cargo build --release

              # Install Python build tools (use latest Python 3 in manylinux)
              PYTHON=\$(ls -d /opt/python/cp3* | sort -V | tail -1)/bin/python
              \$PYTHON -m pip install -q build

              # Build wheel with manylinux_2_28 tag
              GLIBC_VERSION=2_28 MINK_SDK_SKIP_BUILD=1 \$PYTHON scripts/build_wheel.py

              # Copy artifacts to workspace
              mkdir -p /workspace/dist
              cp target/release/mink /workspace/dist/mink-linux-\${{ matrix.arch }}-manylinux_2_28
              cp dist/*.whl /workspace/dist/
            "

      - uses: actions/upload-artifact@v4
        with:
          name: mink-linux-${{ matrix.arch }}-manylinux_2_28
          path: dist/mink-linux-${{ matrix.arch }}-manylinux_2_28

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.arch }}-manylinux_2_28
          path: dist/*.whl

  # ── Build platform wheels ──────────────────────────────────────
  wheels:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-latest
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
            image: quay.io/pypa/manylinux_2_31_x86_64
          - os: linux
            arch: aarch64
            runner: ubuntu-22.04
            image: quay.io/pypa/manylinux_2_31_aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # ── macOS: native build ──────────────────────────────────
      - name: Install Python (macOS)
        if: matrix.os == 'macos'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain (macOS)
        if: matrix.os == 'macos'
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust binary (macOS)
        if: matrix.os == 'macos'
        run: cargo build --release

      - name: Build wheel (macOS)
        if: matrix.os == 'macos'
        run: python scripts/build_wheel.py
        env:
          MINK_SDK_SKIP_BUILD: "1"

      # ── Linux: build inside manylinux_2_31 Docker container ──
      - name: Set up QEMU (aarch64)
        if: matrix.arch == 'aarch64' && matrix.os == 'linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build in manylinux_2_31 container
        if: matrix.os == 'linux'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ matrix.image }} \
            bash -c "
              set -euo pipefail

              # Install Rust
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y -q --default-toolchain stable
              source \$HOME/.cargo/env

              # Build Rust binary
              cargo build --release

              # Build wheel (use latest Python 3 in manylinux)
              PYTHON=\$(ls -d /opt/python/cp3* | sort -V | tail -1)/bin/python
              \$PYTHON -m pip install -q build

              MINK_SDK_SKIP_BUILD=1 GLIBC_VERSION=2_31 \$PYTHON scripts/build_wheel.py

              # Copy wheel to workspace
              mkdir -p /workspace/dist
              cp dist/*.whl /workspace/dist/
            "

      # ── Common: verify & upload ──────────────────────────────
      - name: Verify wheel contains binary
        run: |
          import zipfile
          from pathlib import Path
          whl = list(Path('dist').glob('*.whl'))[0]
          with zipfile.ZipFile(whl) as z:
              names = z.namelist()
              print('\n'.join(names))
              assert any('_binary/mink' in n for n in names), 'missing binary'
        shell: python

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  # ── Publish (on v* tag only) ───────────────────────────────────
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, wheels, manylinux]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # PyPI Trusted Publishing
      contents: write   # GitHub Release
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --registry crates-io || echo "crate already published, skipping"

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mink-*
          path: dist/bin
          merge-multiple: true

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/wheels
          merge-multiple: true

      - name: Show all artifacts
        run: ls -lh dist/bin/ dist/wheels/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bin/mink-*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/wheels
          skip-existing: true
