# Build platform-specific wheels and publish to PyPI.
#
# Strategy
# --------
# Each job compiles the Rust binary for a single (host, target) pair, then
# builds a Python wheel whose platform tag matches that pair.  On tag push
# (v*) the wheels are uploaded to PyPI; on every push they are stored as
# build artifacts for testing.
#
# Supported platforms
# -------------------
# macOS  arm64  (macos-latest)
# macOS  x86_64 (macos-13)
# Linux  x86_64 (ubuntu-latest)
# Linux  aarch64 (ubuntu-24.04-arm)

name: build-and-publish

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:
    branches: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Matrix: one wheel per (os, arch) ─────────────────────────────
  build-wheel:
    name: wheel (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-latest
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
          - os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      # ── Rust toolchain ────────────────────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'aarch64' && 'aarch64-unknown-linux-gnu' || '' }}

      # ── Python ────────────────────────────────────────────────────
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip setuptools wheel build

      # ── Rust build ────────────────────────────────────────────────
      - name: Build Rust binary (release)
        run: cargo build --release
        env:
          CARGO_TERM_COLOR: always

      # ── Python wheel ──────────────────────────────────────────────
      - name: Build platform-specific wheel
        run: python scripts/build_wheel.py
        env:
          MINK_SDK_SKIP_BUILD: "1"  # binary already built above

      - name: Verify wheel contains binary
        run: |
          import zipfile
          from pathlib import Path
          whl = list(Path('dist').glob('*.whl'))[0]
          with zipfile.ZipFile(whl) as z:
              names = z.namelist()
              print('\n'.join(names))
              assert any('_binary/mink' in n for n in names), 'missing binary'
        shell: python

      # ── Upload ────────────────────────────────────────────────────
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  # ── Publish to PyPI on tag ──────────────────────────────────────
  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-wheel]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # needed for Trusted Publishing
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
